apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esphome-config
  namespace: homeassistant
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
  namespace: homeassistant
  labels:
    app: esphome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esphome
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: esphome
    spec:
      nodeSelector:
        kubernetes.io/hostname: example-ha-node
      containers:
      - name: esphome
        image: ghcr.io/esphome/esphome:2026.8.2
        args:
        - dashboard
        - /config
        ports:
        - containerPort: 6052
          name: http
        volumeMounts:
        - name: config
          mountPath: /config
        env:
        - name: TZ
          value: Etc/UTC
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: esphome-config
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: esphome
  namespace: homeassistant
spec:
  selector:
    app: esphome
  ports:
  - port: 6052
    targetPort: 6052
    name: http
