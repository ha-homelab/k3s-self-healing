apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: homeassistant
  labels:
    app: mosquitto
data:
  mosquitto.conf: 'persistence true

    persistence_location /mosquitto/data/

    log_dest stdout

    listener 1883

    allow_anonymous false

    password_file /mosquitto/config/password.txt

    '
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: homeassistant
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: homeassistant
  labels:
    app: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      nodeSelector:
        kubernetes.io/hostname: example-ha-node
      securityContext:
        fsGroup: 1883
        runAsUser: 1883
        runAsGroup: 1883
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
        ports:
        - name: mqtt
          containerPort: 1883
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
        - name: data
          mountPath: /mosquitto/data
        - name: passwd
          mountPath: /mosquitto/config/password.txt
          subPath: password.txt
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
        readinessProbe:
          tcpSocket:
            port: mqtt
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: mqtt
          periodSeconds: 15
          failureThreshold: 4
      volumes:
      - name: config
        configMap:
          name: mosquitto-config
      - name: data
        persistentVolumeClaim:
          claimName: mosquitto-data
      - name: passwd
        secret:
          secretName: mosquitto-passwd
          defaultMode: 288
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: homeassistant
spec:
  type: ClusterIP
  selector:
    app: mosquitto
  ports:
  - name: mqtt
    port: 1883
    targetPort: mqtt
