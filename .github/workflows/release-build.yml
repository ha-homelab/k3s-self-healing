name: Build release assets
'on':
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      release_plan_artifact:
        description: Frozen version plan allocated by the release workflow
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS
      || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
    - name: Download frozen release version plan
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.release_plan_artifact }}
        path: .
    - name: Apply frozen release version inputs
      run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
    - name: Build and verify the exact integration-source archive
      env:
        VERSION: ${{ inputs.version }}
        CHANNEL: ${{ inputs.channel }}
      run: 'python3 -m pip install -r requirements-validation.txt

        python3 scripts/package_candidate.py "$VERSION" "$CHANNEL"

        python3 scripts/verify_source.py release-dist/*.tar.gz'
    - name: Verify all artifact checksums
      working-directory: release-dist
      run: sha256sum --check ./*.sha256
    - name: Verify and stage versioned release assets
      run: python3 scripts/stage_release_assets.py --target package --pattern 'release-dist/*'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-assets-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: release-assets/package/*
        if-no-files-found: error
        retention-days: 14
