name: Validate public source
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.14'
    - run: pip install -r requirements-validation.txt
    - run: python tools/validate.py --lint
    - name: Reproduce pinned HA source imports
      run: python tools/ha_sources.py check --upstream
    - run: python -m unittest discover -s tests
    - name: Verify repeatable source archives
      run: |
        python tools/package_release.py "$RUNNER_TEMP/source-first.tar.gz"
        python tools/package_release.py "$RUNNER_TEMP/source-second.tar.gz"
        cmp "$RUNNER_TEMP/source-first.tar.gz" "$RUNNER_TEMP/source-second.tar.gz"
    - name: Render synthetic installation
      run: 'mkdir -p "$RUNNER_TEMP/public-render"

        python tools/render.py --profile examples/site.example.json companions > "$RUNNER_TEMP/public-render/companions.yaml"

        python tools/render.py --profile examples/site.example.json recovery > "$RUNNER_TEMP/public-render/recovery.yaml"

        '
    - name: Scan public source and rendered manifests for secrets
      run: 'docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        dir /repo --redact --no-banner

        docker run --rm -v "$RUNNER_TEMP/public-render:/rendered:ro" ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        dir /rendered --redact --no-banner

        '
  home-assistant:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Verify native backup compatibility in the pinned runtime
      run: |
        docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m \
          -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/work:ro" -w /work --entrypoint python \
          ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4 \
          native_backup/contract.py --expect-version 2026.10.2
    - name: Run package scenarios in the pinned Home Assistant runtime
      run: "docker run --rm --network none --read-only --tmpfs /tmp:rw,size=512m \\\n  -e PYTHONDONTWRITEBYTECODE=1 -e REQUIRE_HA_RUNTIME=1\
        \ -v \"$PWD:/work:ro\" -w /work --entrypoint python \\\n  ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4\
        \ \\\n  -m unittest discover -s runtime_tests -v\n"
