<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
<title id="title">One candidate. One explicit approval.</title><desc id="desc">Offer a pinned candidate. Exact version + image digest. Status via MQTT; no install Then Accept authenticated intent. Validate candidate and expiry. Persist acceptance before reply Then Verify backup + preflight. Match run and backup receipt. Check config in target image Then Persist private receipt. /state/approvals on state PVC. Receipt failure stops source edit Then Commit only image pins. Helm + native-backup manifest. Apply the approved Helm update Then Check and reconcile. Core + ZHA + MQTT + Matter. Journal uncertain operations. Uncertain writes require inspection. A migrated database is not rolled back by an image tag.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="740" rx="24" fill="#f1f5f9"/><path d="M24 0H1096Q1120 0 1120 24V128H0V24Q0 0 24 0" fill="#0f172a"/>
