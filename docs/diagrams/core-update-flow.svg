t-size="17" fill="#a16207" font-weight="700">4</text><text x="780" y="469" font-size="21" fill="#0f172a" font-weight="700">Persist private receipt</text><text x="780" y="501" font-size="16" fill="#334155" font-weight="400">/state/approvals on state PVC</text><text x="780" y="526" font-size="16" fill="#334155" font-weight="400">Receipt failure stops source edit</text><rect x="400" y="390" width="320" height="180" rx="16" fill="#fff" stroke="#cbd5e1"/><rect x="400" y="390" width="320" height="9" rx="4" fill="#4338ca"/><circle cx="430" cy="426" r="16" fill="#e0e7ff"/><text x="425" y="432" font-size="17" fill="#4338ca" font-weight="700">5</text><text x="420" y="469" font-size="21" fill="#0f172a" font-weight="700">Commit only image pins</text><text x="420" y="501" font-size="16" fill="#334155" font-weight="400">Helm + native-backup manifest</text><text x="420" y="526" font-size="16" fill="#334155" font-weight="400">Apply the approved Helm update</text><rect x="40" y="390" width="320" height="180" rx="16" fill="#fff" stroke="#cbd5e1"/><rect x="40" y="390" width="320" height="9" rx="4" fill="#166534"/><circle cx="70" cy="426" r="16" fill="#dcfce7"/><text x="65" y="432" font-size="17" fill="#166534" font-weight="700">6</text><text x="60" y="469" font-size="21" fill="#0f172a" font-weight="700">Check and reconcile</text><text x="60" y="501" font-size="16" fill="#334155" font-weight="400">Core + ZHA + MQTT + Matter</text><text x="60" y="526" font-size="16" fill="#334155" font-weight="400">Journal uncertain operations</text><path d="M360 250H395" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 250H755" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M920 340V385" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M760 480H725" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M400 480H365" fill="none" stroke="#64748b" stroke-width="2.5" mar