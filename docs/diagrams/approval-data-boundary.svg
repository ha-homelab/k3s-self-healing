t + journal</text><text x="780" y="316" font-size="16" fill="#334155" font-weight="400">/state/approvals/&lt;id&gt;.json</text><text x="780" y="347" font-size="16" fill="#334155" font-weight="400">Receipt file mode: 0600</text><text x="780" y="378" font-size="16" fill="#334155" font-weight="400">Approval directory: 0700</text><text x="780" y="409" font-size="16" fill="#334155" font-weight="400">Preserve in private backups</text><text x="780" y="440" font-size="16" fill="#334155" font-weight="400">Existing record is not replaced</text><rect x="40" y="583" width="1040" height="82" rx="12" fill="#0f172a"/><text x="60" y="617" font-size="19" fill="#fff" font-weight="600">Removing a receipt from the current tree does not erase old Git objects.</text><text x="60" y="645" font-size="16" fill="#cbd5e1" font-weight="400">A source release does not install the worker or demonstrate a successful live upgrade.</text>
