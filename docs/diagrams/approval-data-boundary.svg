<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
<title id="title">Approval data has a private home</title><desc id="desc">SHARED SOURCE: Reusable logic. Worker and validation code. Synthetic test cases. Schemas and release metadata. No operational receipts. Owned in this public project DESIRED-STATE GIT: Two image pins. Approved Core image pin. Native-backup image pin. Exactly reviewed staged paths. No backup identifier. No approval timestamp PRIVATE STATE PVC: Receipt + journal. /state/approvals/&lt;id&gt;.json. Receipt file mode: 0600. Approval directory: 0700. Preserve in private backups. Existing record is not replacedRemoving a receipt from the current tree does not erase old Git objects.. A source release does not install the worker or demonstrate a successful live upgrade.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="740" rx="24" fill="#f1f5f9"/><path d="M24 0H1096Q1120 0 1120 24V128H0V24Q0 0 24 0" fill="#0f172a"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="48" font-size="29" fill="#ffffff" font-weight="700">Approval data has a private home</text><text x="40" y="84" font-size="17" fill="#cbd5e1" font-weight="400">The receipt proves selected intent and backup; the operation journal records progress.</text>
