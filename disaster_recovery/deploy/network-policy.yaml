apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recovery-api-only
  namespace: ha-disaster-recovery
spec:
  podSelector:
    matchLabels:
      app: ha-disaster-recovery
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - ipBlock:
        cidr: 192.0.2.10/32
    ports:
    - protocol: TCP
      port: 6443
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - protocol: TCP
      port: 443
