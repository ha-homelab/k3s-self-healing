apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deploy/namespace.yaml
- deploy/storage.yaml
- deploy/rbac.yaml
- deploy/cronjob.yaml
- deploy/network-policy.yaml
- deploy/music-backup.yaml
configMapGenerator:
- name: recovery-source
  namespace: ha-disaster-recovery
  files:
  - __init__.py
  - archive.py
  - restore.py
  - prepare.py
  - kubernetes.py
  - runner.py
  - config.json
  - RUNBOOK.md
- name: music-recovery-source
  namespace: homeassistant
  files:
  - __init__.py
  - archive.py
  - restore.py
  - runner.py
  - kubernetes.py
  - music.py
