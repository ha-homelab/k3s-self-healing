name: Core update proposals
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    tags:
      - 'ha-core-install/**'
permissions:
  contents: read
concurrency:
  group: core-update-proposals
  cancel-in-progress: false
jobs:
  proposal:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/ha-core-install/') }}
    runs-on: ${{ fromJSON(github.event.repository.private == true && (vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (vars.CI_RUNNER_AUTOMATION_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install PyYAML==6.0.3
      - name: Verify proposal boundaries without service access
        run: python -m unittest discover -s tests -p test_core_update_proposals.py -v
      - name: Prepare latest stable proposal
        if: ${{ github.event_name != 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python core_updates/proposals.py propose
      - name: Merge the exact worker-approved proposal
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python core_updates/proposals.py merge
